# dsh-task-lisk 的 bundle 补丁：把任务看板挂进 profile。
# 出现在 profile 的 dsh.profile.bundles 列表时生效。
# 宿主半身：领域存储（task-lisk）、/dsh-task-lisk RPC 通道、task_lisk 工具、
#           todo/write 会话折叠（agent 会话内清单 → 看板）、agent/pre-step 暂停卡门。
# 浏览器半身：侧边栏面板列表的「任务」图标 + main 主面板的任务看板页面。

- insert:
    - id: dsh-task-lisk
      name: dsh-task-lisk